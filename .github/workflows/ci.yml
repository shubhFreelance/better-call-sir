name: Sprint acceptance
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  development-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: bcs_dev
          POSTGRES_PASSWORD: bcs_dev_local
          POSTGRES_DB: bcs_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bcs_dev -d bcs_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Synthetic configuration
        run: |
          cp .env.example .env
          mkdir -p test-results
      - run: npm ci
      - run: npm run generate
      - id: contract-lint
        run: npm run contract:lint > test-results/contract-lint.txt 2>&1
      - id: generated-client
        run: git diff --exit-code -- packages/api-client/src/generated.ts
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Deterministic ClamAV engine fixture
        run: npm run scanner:test:setup
      - id: typecheck
        run: npm run typecheck > test-results/typecheck.txt 2>&1
      - id: unit
        run: npm exec -- tsx --test --test-reporter=junit tests/policies.test.ts tests/calendar.test.ts tests/ranking.test.ts tests/email-otp.test.ts tests/recurring.test.ts > test-results/unit.xml
      - id: integration
        run: npm exec -- tsx --test --test-concurrency=1 --test-reporter=junit tests/api.test.ts > test-results/integration.xml
      - id: contract
        run: npm exec -- tsx --test --test-reporter=junit tests/contract.test.ts > test-results/contract.xml
      - id: mock
        run: npm exec -- tsx --test --test-reporter=junit tests/mock.test.ts > test-results/mock.xml
      - id: security-tests
        run: npm exec -- tsx --test --test-reporter=junit tests/security.test.ts tests/ci-evidence.test.ts > test-results/security-tests.xml
      - id: release-gate
        run: npm exec -- tsx --test --test-reporter=junit tests/release.test.ts > test-results/release-gate.xml
      - id: browser
        run: npm run test:e2e > test-results/browser.txt 2>&1
      - id: build
        run: npm run build > test-results/build.txt 2>&1
      - name: Secrets scan (source content is excluded from the report)
        id: secrets
        run: npm run --silent security:secrets > test-results/secrets.json
      - name: Runtime dependency audit
        id: runtime-audit
        run: npm audit --omit=dev --json > test-results/runtime-audit.json
      - name: Development tooling dependency audit
        id: tooling-audit
        run: npm audit --json > test-results/tooling-audit.json
      - name: Record exact source and check outcomes
        if: always()
        env:
          BCS_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BCS_CHECK_RESULTS: >-
            {"contractLint":"${{ steps.contract-lint.outcome }}","generatedClient":"${{ steps.generated-client.outcome }}","typecheck":"${{ steps.typecheck.outcome }}","unit":"${{ steps.unit.outcome }}","integration":"${{ steps.integration.outcome }}","contract":"${{ steps.contract.outcome }}","mock":"${{ steps.mock.outcome }}","securityTests":"${{ steps.security-tests.outcome }}","releaseGate":"${{ steps.release-gate.outcome }}","browser":"${{ steps.browser.outcome }}","build":"${{ steps.build.outcome }}","secrets":"${{ steps.secrets.outcome }}","runtimeAudit":"${{ steps.runtime-audit.outcome }}","toolingAudit":"${{ steps.tooling-audit.outcome }}"}
        run: node scripts/ci-evidence.mjs
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: sprint-acceptance-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
